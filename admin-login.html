<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio OALUM Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="./oalum_favicon.png">
  <link rel="stylesheet" href="./runtime/storefront/styles/reset.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/variables.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/admin-login.css?v=20260816-01">
</head>
<body class="admin-login-page">
  <main class="admin-login-main">
    <section class="admin-login-panel" aria-labelledby="adminLoginTitle">
      <p class="admin-login-kicker">Studio OALUM</p>
      <h1 id="adminLoginTitle">Admin</h1>
      <form class="admin-login-form js-admin-login-form">
        <label>
          <span>관리자 비밀번호</span>
          <input type="password" name="adminSecret" autocomplete="current-password" required autofocus>
        </label>
        <button type="submit">로그인</button>
      </form>
      <p class="admin-login-status js-admin-login-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="./runtime/storefront/scripts/admin-login.js?v=20260816-01"></script>
</body>
</html>
