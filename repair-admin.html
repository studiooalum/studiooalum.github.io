<!DOCTYPE html>
<html lang="ko">
<head>
  <script>document.documentElement.classList.add("admin-session-pending");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio OALUM - Repair Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="./oalum_favicon.png">

  <link rel="stylesheet" href="./runtime/storefront/styles/reset.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/variables-20260818-01.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/layout.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/gnb-20260818-05.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/fulfillment.css?v=20260816-04">
  <link rel="stylesheet" href="./runtime/storefront/styles/repair-admin.css?v=20260816-04">
  <script type="module" src="./runtime/storefront/scripts/admin-page-guard.js?v=20260816-01"></script>
</head>
<body class="fulfillment-page repair-admin-page">
  <nav class="gnb gnb--account">
    <a href="./repair.html" class="gnb__back">← Repair</a>
    <span class="gnb__title">Repair Admin</span>
    <span class="gnb__spacer"></span>
  </nav>

  <main class="fulfillment-main">
    <section class="fulfillment-shell">
      <aside class="fulfillment-sidebar">
        <section class="fulfillment-panel">
          <nav class="fulfillment-tabs" aria-label="관리자 기능" data-repair-admin-auth-guard hidden>
            <a href="./admin.html" class="fulfillment-tab">배송 / 주문</a>
            <a href="./coupons.html" class="fulfillment-tab">쿠폰 관리</a>
            <a href="./workshop-admin.html" class="fulfillment-tab">워크숍 예약</a>
            <a href="./repair-admin.html" class="fulfillment-tab is-active" aria-current="page">수선 신청</a>
            <a href="./newsletter-admin.html" class="fulfillment-tab">뉴스레터</a>
            <button type="button" class="fulfillment-tab js-admin-session-logout">로그아웃</button>
          </nav>

          <h1 class="fulfillment-heading">수선 신청 관리</h1>
          <p class="fulfillment-copy">접수 상태와 견적, 고객 안내를 관리합니다. 원본 사진은 관리자 세션에서만 확인할 수 있습니다.</p>

          <form class="fulfillment-auth-form js-repair-admin-auth-form" data-admin-login-only>
            <label class="fulfillment-field">
              <span>관리자 비밀번호</span>
              <input type="password" name="adminSecret" autocomplete="current-password" required>
            </label>
            <div class="fulfillment-actions fulfillment-actions--compact">
              <button type="submit" class="fulfillment-btn">관리 시작</button>
              <button type="button" class="fulfillment-btn fulfillment-btn--secondary js-repair-admin-auth-clear">로그아웃</button>
            </div>
          </form>
          <p class="fulfillment-status js-repair-admin-auth-status" data-admin-login-only role="status" aria-live="polite"></p>
        </section>

        <section class="fulfillment-panel repair-admin-list-panel" data-repair-admin-auth-guard hidden>
          <div class="repair-admin-list-head">
            <h2 class="fulfillment-subheading">접수 목록</h2>
            <button type="button" class="repair-admin-refresh js-repair-admin-refresh" aria-label="접수 목록 새로고침" title="접수 목록 새로고침">↻</button>
          </div>
          <label class="fulfillment-field repair-admin-filter">
            <span>상태</span>
            <select class="js-repair-admin-status-filter">
              <option value="all">전체</option>
              <option value="received">접수됨</option>
              <option value="reviewing">검토 중</option>
              <option value="quoted">견적 전달</option>
              <option value="approved">진행 승인</option>
              <option value="in_progress">작업 중</option>
              <option value="completed">완료</option>
              <option value="cancelled">취소</option>
            </select>
          </label>
          <p class="fulfillment-status js-repair-admin-list-status" role="status" aria-live="polite"></p>
          <div class="repair-admin-request-list js-repair-admin-request-list">
            <div class="fulfillment-empty">관리자 인증 후 수선 접수가 표시됩니다.</div>
          </div>
        </section>

        <section class="fulfillment-panel repair-admin-gallery-panel" data-repair-admin-auth-guard hidden>
          <h2 class="fulfillment-subheading">수선 작업 사진</h2>
          <p class="fulfillment-copy">Repair Studio 공개 갤러리에 표시할 이미지를 등록합니다.</p>
          <form class="repair-admin-gallery-upload js-repair-gallery-upload-form">
            <label class="fulfillment-field">
              <span>이미지</span>
              <input type="file" name="file" accept="image/jpeg,image/png,image/webp,image/avif" required>
            </label>
            <fieldset class="repair-admin-methods">
              <legend>수선 방식 (복수 선택)</legend>
              <label><input type="checkbox" name="methods" value="patch"> PATCH</label>
              <label><input type="checkbox" name="methods" value="woven"> WOVEN</label>
              <label><input type="checkbox" name="methods" value="sashiko"> SASHIKO / VISIBLE MENDING</label>
              <label><input type="checkbox" name="methods" value="boro"> BORO</label>
            </fieldset>
            <label class="fulfillment-field">
              <span>정렬 순서</span>
              <input type="number" name="sortOrder" min="0" step="1" value="0">
            </label>
            <button type="submit" class="fulfillment-btn js-repair-gallery-upload">사진 등록</button>
          </form>
          <p class="fulfillment-status js-repair-gallery-status" role="status" aria-live="polite"></p>
          <div class="repair-admin-gallery-list js-repair-gallery-list"></div>
        </section>
      </aside>

      <section class="fulfillment-content repair-admin-content" data-repair-admin-auth-guard hidden>
        <section class="fulfillment-panel">
          <div class="repair-admin-empty js-repair-admin-empty">왼쪽 목록에서 수선 접수를 선택해주세요.</div>

          <form class="repair-admin-form js-repair-admin-form" hidden>
            <input type="hidden" name="id">

            <header class="repair-admin-editor-head">
              <div>
                <p class="repair-admin-request-number js-repair-admin-request-number"></p>
                <h2 class="fulfillment-subheading js-repair-admin-title"></h2>
              </div>
              <p class="repair-admin-created-at js-repair-admin-created-at"></p>
            </header>

            <section class="repair-admin-customer">
              <h3 class="fulfillment-subheading">신청 내용</h3>
              <div class="js-repair-admin-customer"></div>
            </section>
            <p class="repair-admin-archive-candidate js-repair-admin-archive-candidate" hidden></p>

            <div class="repair-admin-form-grid">
              <label class="fulfillment-field">
                <span>처리 상태</span>
                <select name="status">
                  <option value="received">접수됨</option>
                  <option value="reviewing">검토 중</option>
                  <option value="quoted">예상 가격 안내</option>
                  <option value="approved">진행 승인</option>
                  <option value="in_progress">작업 중</option>
                  <option value="completed">작업 완료 / 최종 가격 안내</option>
                  <option value="cancelled">취소</option>
                </select>
              </label>
              <label class="fulfillment-field">
                <span>예상 가격 <em>선택</em></span>
                <input type="number" name="quoteAmount" min="0" max="100000000" step="100" inputmode="numeric" placeholder="KRW">
              </label>
              <label class="fulfillment-field">
                <span>최종 가격 <em>선택</em></span>
                <input type="number" name="finalAmount" min="0" max="100000000" step="100" inputmode="numeric" placeholder="KRW">
              </label>
            </div>

            <label class="fulfillment-field">
              <span>고객 안내 문구</span>
              <textarea name="customerMessage" rows="4" maxlength="2000" placeholder="견적, 작업 가능 여부, 다음 절차를 고객에게 안내할 문구입니다."></textarea>
            </label>
            <label class="fulfillment-field">
              <span>내부 메모</span>
              <textarea name="adminNote" rows="6" maxlength="4000" placeholder="내부 검토 메모는 고객에게 노출되지 않습니다."></textarea>
            </label>

            <section class="repair-admin-images">
              <div class="repair-admin-images__head">
                <div>
                  <h3 class="fulfillment-subheading">검토 사진</h3>
                  <p>이미지는 관리자 인증 헤더를 포함한 요청으로만 불러옵니다.</p>
                </div>
                <span class="repair-admin-image-count js-repair-admin-image-count"></span>
              </div>
              <div class="repair-admin-image-list js-repair-admin-image-list"></div>
            </section>

            <div class="repair-admin-action-bar">
              <button type="submit" class="fulfillment-btn js-repair-admin-save">저장</button>
            </div>
            <p class="fulfillment-status js-repair-admin-form-status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </section>
    </section>
  </main>

  <script type="module" src="./runtime/storefront/scripts/repair-admin.js?v=20260818-01"></script>
  <script type="module">
    import { initSiteChrome } from "./runtime/storefront/scripts/components/siteChrome-20260818-05.js";

    initSiteChrome({ showActions: false });
  </script>
</body>
</html>
