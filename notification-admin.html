<!DOCTYPE html>
<html lang="ko">
<head>
  <script>document.documentElement.classList.add("admin-session-pending");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio OALUM - Notification Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="./oalum_favicon.png">

  <link rel="stylesheet" href="./runtime/storefront/styles/reset.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/variables-20260818-01.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/layout.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/gnb-20260818-05.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/fulfillment.css?v=20260816-04">
  <link rel="stylesheet" href="./runtime/storefront/styles/notification-admin-20260824-01.css">
  <script type="module" src="./runtime/storefront/scripts/admin-page-guard.js?v=20260816-01"></script>
</head>
<body class="fulfillment-page notification-admin-page">
  <nav class="gnb gnb--account">
    <a href="./repair-admin.html" class="gnb__back">← Repair Admin</a>
    <span class="gnb__title">Notification Admin</span>
    <span class="gnb__spacer"></span>
  </nav>

  <main class="fulfillment-main">
    <section class="notification-admin-shell">
      <aside class="notification-admin-sidebar">
        <section class="fulfillment-panel">
          <nav class="fulfillment-tabs" aria-label="관리자 기능" data-notification-auth-guard hidden>
            <a href="./admin.html" class="fulfillment-tab">배송 / 주문</a>
            <a href="./coupons.html" class="fulfillment-tab">쿠폰 관리</a>
            <a href="./workshop-admin.html" class="fulfillment-tab">워크숍 예약</a>
            <a href="./repair-admin.html" class="fulfillment-tab">수선 신청</a>
            <a href="./newsletter-admin.html" class="fulfillment-tab">뉴스레터</a>
            <a href="./notification-admin.html" class="fulfillment-tab is-active" aria-current="page">Notification Admin</a>
          </nav>

          <h1 class="fulfillment-heading">알림 관리</h1>
          <p class="fulfillment-copy">고객에게 자동으로 전달되는 이메일과 문자의 초안을 관리합니다.</p>
          <form class="fulfillment-auth-form js-notification-auth-form" data-admin-login-only>
            <label class="fulfillment-field"><span>관리자 비밀번호</span><input type="password" name="adminSecret" autocomplete="current-password" required></label>
            <button type="submit" class="fulfillment-btn">관리 시작</button>
          </form>
          <p class="fulfillment-status js-notification-auth-status" data-admin-login-only role="status"></p>
        </section>

        <section class="fulfillment-panel" data-notification-auth-guard hidden>
          <div class="notification-filter-grid">
            <label class="fulfillment-field"><span>사용 영역</span><select class="js-notification-area-filter"><option value="all">전체</option><option value="shop">Shop</option><option value="workshop">Workshop</option><option value="repair">Repair</option><option value="ticket">Ticket</option></select></label>
            <label class="fulfillment-field"><span>발송 채널</span><select class="js-notification-channel-filter"><option value="all">전체</option><option value="email">이메일</option><option value="sms">문자</option></select></label>
            <label class="fulfillment-field"><span>상태</span><select class="js-notification-enabled-filter"><option value="all">전체</option><option value="enabled">활성화됨</option><option value="disabled">비활성화됨</option></select></label>
          </div>
          <div class="notification-template-list js-notification-template-list"></div>
        </section>
      </aside>

      <section class="notification-admin-content" data-notification-auth-guard hidden>
        <section class="fulfillment-panel notification-editor-empty js-notification-editor-empty">왼쪽 목록에서 알림을 선택해주세요.</section>
        <form class="fulfillment-panel notification-editor js-notification-editor" hidden>
          <header class="notification-editor__head">
            <div>
              <p class="notification-editor__area js-notification-editor-area"></p>
              <h2 class="fulfillment-subheading js-notification-editor-title"></h2>
              <p class="fulfillment-copy js-notification-editor-description"></p>
            </div>
            <label class="notification-enabled-toggle"><input type="checkbox" name="isEnabled"><span>알림 활성화</span></label>
          </header>

          <label class="fulfillment-field js-notification-subject-field"><span>이메일 제목</span><input type="text" name="subject" maxlength="500"></label>
          <label class="fulfillment-field"><span>본문</span><textarea name="body" rows="12" maxlength="6000" required></textarea></label>

          <section class="notification-variables">
            <div><h3 class="fulfillment-subheading">내용 변수</h3><p>버튼을 누르면 현재 입력 위치에 고객 정보가 삽입됩니다.</p></div>
            <div class="notification-variable-list js-notification-variable-list"></div>
          </section>

          <section class="notification-preview-panel">
            <div class="notification-preview-panel__head">
              <h3 class="fulfillment-subheading">미리보기</h3>
              <div class="notification-preview-modes" role="tablist">
                <button type="button" class="is-active" data-preview-mode="mobile">모바일</button>
                <button type="button" data-preview-mode="email">이메일</button>
                <button type="button" data-preview-mode="sms">SMS/LMS</button>
              </div>
            </div>
            <div class="notification-preview js-notification-preview"><p>미리보기를 눌러주세요.</p></div>
          </section>

          <div class="notification-editor__actions">
            <button type="button" class="fulfillment-btn fulfillment-btn--secondary js-notification-preview-action">미리보기</button>
            <button type="submit" class="fulfillment-btn js-notification-save">초안 저장</button>
            <button type="button" class="fulfillment-btn fulfillment-btn--secondary js-notification-test">테스트 발송</button>
            <button type="button" class="fulfillment-btn js-notification-activate">초안 활성화</button>
            <button type="button" class="fulfillment-btn fulfillment-btn--secondary js-notification-restore">기본 템플릿 복원</button>
          </div>
          <p class="fulfillment-status js-notification-editor-status" role="status" aria-live="polite"></p>
          <p class="notification-editor__updated js-notification-editor-updated"></p>
          <div class="notification-revision-list js-notification-revision-list"></div>
        </form>

        <section class="fulfillment-panel notification-delivery-panel">
          <div class="notification-delivery-head">
            <div><h2 class="fulfillment-subheading">발송 기록</h2><p class="fulfillment-copy">실패 및 확인이 필요한 알림을 확인하고 명시적으로 재시도합니다.</p></div>
            <button type="button" class="fulfillment-btn fulfillment-btn--secondary js-notification-process">대기열 확인</button>
          </div>
          <div class="notification-delivery-list js-notification-delivery-list"></div>
        </section>
      </section>
    </section>
  </main>

  <script type="module" src="./runtime/storefront/scripts/notification-admin-20260824-01.js"></script>
  <script type="module">
    import { initSiteChrome } from "./runtime/storefront/scripts/components/siteChrome-20260818-05.js";
    initSiteChrome({ showActions: false });
  </script>
</body>
</html>
