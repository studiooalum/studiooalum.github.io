<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Oalum — Workshop Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="./oalum_favicon.png">

  <link rel="stylesheet" href="./runtime/storefront/styles/reset.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/variables.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/layout.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/gnb.css">
  <link rel="stylesheet" href="./runtime/storefront/styles/fulfillment.css?v=20260706-01">
</head>
<body class="fulfillment-page workshop-admin-page">
  <nav class="gnb gnb--account">
    <a href="./shop.html" class="gnb__back">← Shop</a>
    <span class="gnb__title">워크숍 예약</span>
    <span class="gnb__spacer"></span>
  </nav>

  <main class="fulfillment-main">
    <section class="fulfillment-shell">
      <aside class="fulfillment-sidebar">
        <section class="fulfillment-panel">
          <nav class="fulfillment-tabs" aria-label="관리자 기능">
            <a href="./admin.html" class="fulfillment-tab">배송 / 주문</a>
            <a href="./coupons.html" class="fulfillment-tab">쿠폰 관리</a>
            <a href="./workshop-admin.html" class="fulfillment-tab is-active" aria-current="page">워크숍 예약</a>
          </nav>

          <h1 class="fulfillment-heading">워크숍 예약 관리</h1>
          <p class="fulfillment-copy">예약 조회, 예약 취소 복원, 날짜 차단/해제를 한 화면에서 관리합니다.</p>

          <div class="fulfillment-access-summary">
            <strong class="fulfillment-access-badge js-workshop-admin-access-badge">잠금 상태</strong>
            <p class="fulfillment-copy js-workshop-admin-access-copy">관리자 인증 전에는 예약 데이터와 차단 일정이 로드되지 않습니다.</p>
            <p class="fulfillment-copy fulfillment-copy--quiet js-workshop-admin-access-meta">ORDER_ADMIN_SECRET 원문은 브라우저에 저장하지 않습니다.</p>
          </div>

          <form class="fulfillment-auth-form js-workshop-admin-auth-form">
            <label class="fulfillment-field">
              <span>관리자 키</span>
              <input type="password" name="adminSecret" autocomplete="off" placeholder="ORDER_ADMIN_SECRET" required>
            </label>
            <div class="fulfillment-actions fulfillment-actions--compact">
              <button type="submit" class="fulfillment-btn">잠금 해제</button>
              <button type="button" class="fulfillment-btn fulfillment-btn--secondary js-workshop-admin-auth-clear">초기화</button>
            </div>
          </form>

          <p class="fulfillment-status js-workshop-admin-auth-status" role="status" aria-live="polite"></p>
        </section>

        <section class="fulfillment-panel" data-workshop-admin-auth-guard hidden>
          <div class="fulfillment-toolbar">
            <label class="fulfillment-field fulfillment-field--toolbar">
              <span>예약 검색</span>
              <input type="search" class="js-workshop-admin-search-input" placeholder="워크숍명, 예약자명, 이메일, 날짜">
            </label>
            <label class="fulfillment-field fulfillment-field--toolbar">
              <span>상태</span>
              <select class="js-workshop-admin-status-filter">
                <option value="all">전체</option>
                <option value="confirmed">확정</option>
                <option value="cancelled">취소</option>
              </select>
            </label>
            <div class="fulfillment-actions fulfillment-actions--compact">
              <button type="button" class="fulfillment-btn fulfillment-btn--secondary js-workshop-admin-search-btn">조회</button>
              <button type="button" class="fulfillment-btn fulfillment-btn--secondary js-workshop-admin-refresh-btn">최신</button>
            </div>
          </div>

          <p class="fulfillment-status js-workshop-admin-list-status" role="status" aria-live="polite"></p>
          <div class="fulfillment-order-list js-workshop-admin-reservation-list">
            <div class="fulfillment-empty">관리자 인증 후 워크숍 예약 목록이 여기에 표시됩니다.</div>
          </div>
        </section>

        <section class="fulfillment-panel" data-workshop-admin-auth-guard hidden>
          <h2 class="fulfillment-subheading">날짜 차단 관리</h2>
          <form class="fulfillment-form js-workshop-admin-block-form">
            <label class="fulfillment-field">
              <span>워크숍</span>
              <select name="workshopSlug" class="js-workshop-admin-workshop-select" required></select>
            </label>
            <label class="fulfillment-field">
              <span>차단 날짜</span>
              <input type="date" name="slotDate" required>
            </label>
            <label class="fulfillment-field">
              <span>사유</span>
              <input type="text" name="reason" maxlength="200" placeholder="예: 개인 일정, 마감" required>
            </label>
            <div class="fulfillment-actions">
              <button type="submit" class="fulfillment-btn">날짜 차단</button>
            </div>
            <p class="fulfillment-status js-workshop-admin-block-status" role="status" aria-live="polite"></p>
          </form>

          <div class="fulfillment-config js-workshop-admin-block-list">
            <div class="fulfillment-empty">현재 등록된 차단 일정이 없습니다.</div>
          </div>
        </section>
      </aside>

      <section class="fulfillment-content" data-workshop-admin-auth-guard hidden>
        <section class="fulfillment-panel">
          <h2 class="fulfillment-subheading">선택한 예약</h2>
          <div class="fulfillment-selection js-workshop-admin-detail">
            <div class="fulfillment-empty">왼쪽 목록에서 예약을 선택하세요.</div>
          </div>
          <div class="fulfillment-actions js-workshop-admin-detail-actions" hidden>
            <button type="button" class="fulfillment-btn js-workshop-admin-cancel-btn">예약 취소</button>
            <button type="button" class="fulfillment-btn fulfillment-btn--secondary js-workshop-admin-restore-btn">취소 복원</button>
          </div>
          <p class="fulfillment-status js-workshop-admin-detail-status" role="status" aria-live="polite"></p>
        </section>
      </section>
    </section>
  </main>

  <script type="module" src="./runtime/storefront/scripts/workshop-admin.js?v=20260706-01"></script>
  <script type="module">
    import { initSiteChrome } from "./runtime/storefront/scripts/components/siteChrome.js";

    initSiteChrome({ showActions: false });
  </script>
</body>
</html>
